<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Bedrock — a from-scratch OS kernel and GUI desktop in Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#121b24"/>
    </linearGradient>
    <linearGradient id="amberSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB870"/>
      <stop offset="0.5" stop-color="#F2A25C"/>
      <stop offset="1" stop-color="#6BA8C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A25C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F2A25C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="22" fill="none" stroke="#2b3a47" stroke-width="1.5"/>
  <ellipse cx="800" cy="140" rx="300" ry="210" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="64" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="url(#amberSteel)">Bedrock</text>
  <text x="66" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#cfdee8">A from-scratch OS kernel&#160;&#43;&#160;GUI desktop, no Linux underneath</text>

  <!-- tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="64" y="192" width="120" height="30" rx="15" fill="#F2A25C" fill-opacity="0.14" stroke="#F2A25C" stroke-opacity="0.5"/>
      <text x="124" y="212" fill="#F5BE8C" text-anchor="middle">no_std Rust</text>
    </g>
    <g>
      <rect x="194" y="192" width="132" height="30" rx="15" fill="#F2A25C" fill-opacity="0.14" stroke="#F2A25C" stroke-opacity="0.5"/>
      <text x="260" y="212" fill="#F5BE8C" text-anchor="middle">x86_64 &#183; ring 0</text>
    </g>
    <g>
      <rect x="336" y="192" width="176" height="30" rx="15" fill="#6BA8C9" fill-opacity="0.14" stroke="#6BA8C9" stroke-opacity="0.5"/>
      <text x="424" y="212" fill="#9CCBE4" text-anchor="middle">own VM &#183; scheduler &#183; FS</text>
    </g>
    <g>
      <rect x="522" y="192" width="118" height="30" rx="15" fill="#6BA8C9" fill-opacity="0.14" stroke="#6BA8C9" stroke-opacity="0.5"/>
      <text x="581" y="212" fill="#9CCBE4" text-anchor="middle">67 host tests</text>
    </g>
  </g>

  <!-- strata motif: the layer stack this kernel is built as, apps on top,
       bare metal at the bottom, warming from steel to amber going down -->
  <g>
    <rect x="742" y="72"  width="190" height="18" rx="5" fill="#6BA8C9" fill-opacity="0.10" stroke="#6BA8C9" stroke-opacity="0.60"/>
    <rect x="730" y="98"  width="214" height="18" rx="5" fill="#6BA8C9" fill-opacity="0.12" stroke="#6BA8C9" stroke-opacity="0.55"/>
    <rect x="718" y="124" width="238" height="18" rx="5" fill="#7FB3C9" fill-opacity="0.13" stroke="#8FBBD1" stroke-opacity="0.55"/>
    <rect x="706" y="150" width="262" height="18" rx="5" fill="#C9A07A" fill-opacity="0.14" stroke="#D2A87F" stroke-opacity="0.55"/>
    <rect x="694" y="176" width="286" height="18" rx="5" fill="#F2A25C" fill-opacity="0.16" stroke="#F2A25C" stroke-opacity="0.65"/>
    <rect x="682" y="202" width="310" height="18" rx="5" fill="#F2A25C" fill-opacity="0.20" stroke="#FFB870" stroke-opacity="0.75"/>
  </g>

  <!-- a tiny window + cursor riding the top stratum: the GUI on top of it all -->
  <g>
    <rect x="770" y="34" width="70" height="30" rx="4" fill="#0d1620" stroke="#6BA8C9" stroke-width="1.8"/>
    <rect x="770" y="34" width="70" height="9" rx="4" fill="#6BA8C9" fill-opacity="0.35"/>
    <circle cx="834" cy="38.5" r="2" fill="#F2A25C"/>
    <path d="M856,40 L856,60 L861,55.5 L864.5,63 L867.5,61.5 L864,54.5 L870,54 Z" fill="#e9f0f5"/>
  </g>
</svg>
