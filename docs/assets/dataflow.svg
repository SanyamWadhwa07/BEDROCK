<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 596" width="1100" height="596" role="img" aria-label="Bedrock hot paths: input from IRQ to pixels, and storage from app to disk">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#111a23"/>
    </linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6BA8C9"/>
    </marker>
    <marker id="a2amber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#F2A25C"/>
    </marker>
    <style>
      .lbl  { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#e9f0f5; }
      .sub  { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#93a7b4; }
      .h    { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#F2A25C; font-weight:700; }
      .h2   { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#6BA8C9; font-weight:700; }
      .node { fill:#0e1822; stroke:#6BA8C9; stroke-opacity:.45; stroke-width:1.6; }
      .hw   { fill:#0e1822; stroke:#F2A25C; stroke-opacity:.6; stroke-width:1.6; }
      .edge { stroke:#6BA8C9; stroke-width:2; fill:none; marker-end:url(#a2); }
      .edgeA{ stroke:#F2A25C; stroke-width:2; fill:none; marker-end:url(#a2amber); }
      .win  { stroke:#F2A25C; stroke-width:1.6; fill:none; stroke-dasharray:5 4; marker-end:url(#a2amber); }
    </style>
  </defs>

  <rect width="1100" height="596" rx="20" fill="url(#dbg)"/>
  <text x="40" y="44" class="h" font-size="21">Bedrock &#8212; the two hot paths</text>
  <text x="40" y="65" class="sub" font-size="12.5">every stage below is real code in this repo; the numbers come from <tspan fill="#e9f0f5">bench</tspan> / <tspan fill="#e9f0f5">metrics</tspan> commands built into the kernel</text>

  <!-- ============ INPUT PATH ============ -->
  <text x="40" y="102" class="h2" font-size="15">Input &#8212; hardware interrupt to lit pixels</text>

  <rect class="hw"   x="40"  y="116" width="146" height="62" rx="11"/>
  <text x="113" y="142" class="lbl" font-size="13" font-weight="600" text-anchor="middle">PS/2 mouse</text>
  <text x="113" y="160" class="sub" font-size="10.5" text-anchor="middle">3-byte packets</text>

  <rect class="node" x="216" y="116" width="160" height="62" rx="11"/>
  <text x="296" y="138" class="lbl" font-size="13" font-weight="600" text-anchor="middle">IRQ12 handler</text>
  <text x="296" y="155" class="sub" font-size="10.5" text-anchor="middle">read port &#183; TSC stamp</text>
  <text x="296" y="169" class="sub" font-size="10.5" text-anchor="middle">&#183; EOI, nothing more</text>

  <rect class="node" x="406" y="116" width="160" height="62" rx="11"/>
  <text x="486" y="138" class="lbl" font-size="13" font-weight="600" text-anchor="middle">SPSC ring buffer</text>
  <text x="486" y="155" class="sub" font-size="10.5" text-anchor="middle">lock-free, atomic</text>
  <text x="486" y="169" class="sub" font-size="10.5" text-anchor="middle">head/tail &#183; ISR never blocks</text>

  <rect class="node" x="596" y="116" width="160" height="62" rx="11"/>
  <text x="676" y="138" class="lbl" font-size="13" font-weight="600" text-anchor="middle">WM task drains</text>
  <text x="676" y="155" class="sub" font-size="10.5" text-anchor="middle">packet FSM &#183; hit-test</text>
  <text x="676" y="169" class="sub" font-size="10.5" text-anchor="middle">drag / resize / focus</text>

  <rect class="node" x="786" y="116" width="140" height="62" rx="11"/>
  <text x="856" y="138" class="lbl" font-size="13" font-weight="600" text-anchor="middle">Dirty rects</text>
  <text x="856" y="155" class="sub" font-size="10.5" text-anchor="middle">bounding-box union</text>
  <text x="856" y="169" class="sub" font-size="10.5" text-anchor="middle">cap 16 &#8594; full redraw</text>

  <rect class="hw"   x="956" y="116" width="104" height="62" rx="11"/>
  <text x="1008" y="142" class="lbl" font-size="13" font-weight="600" text-anchor="middle">present()</text>
  <text x="1008" y="160" class="sub" font-size="10.5" text-anchor="middle">MMIO blit</text>

  <path class="edge" d="M186,147 L216,147"/>
  <path class="edge" d="M376,147 L406,147"/>
  <path class="edge" d="M566,147 L596,147"/>
  <path class="edge" d="M756,147 L786,147"/>
  <path class="edge" d="M926,147 L956,147"/>

  <!-- latency bracket under the input path -->
  <path d="M296,190 L296,202 L1008,202 L1008,190" stroke="#F2A25C" stroke-opacity=".45" stroke-width="1.4" fill="none"/>
  <text x="652" y="222" class="sub" font-size="11.5" text-anchor="middle">input latency is stamped here and closed out here &#183; instrumented and shipping, but reads 0 headless (no mouse packets in this sandbox)</text>

  <!-- ============ STORAGE PATH ============ -->
  <text x="40" y="278" class="h2" font-size="15">Storage &#8212; app to platter</text>

  <rect class="node" x="40"  y="292" width="150" height="60" rx="11"/>
  <text x="115" y="316" class="lbl" font-size="13" font-weight="600" text-anchor="middle">Terminal / Editor</text>
  <text x="115" y="334" class="sub" font-size="10.5" text-anchor="middle">read &#183; write &#183; rm &#183; mv</text>

  <rect class="node" x="220" y="292" width="180" height="60" rx="11"/>
  <text x="310" y="314" class="lbl" font-size="13" font-weight="600" text-anchor="middle">SimpleFS</text>
  <text x="310" y="331" class="sub" font-size="10.5" text-anchor="middle">inode: 10 direct + 1 indirect</text>
  <text x="310" y="345" class="sub" font-size="10.5" text-anchor="middle">two free-space bitmaps</text>

  <rect class="node amber" x="430" y="292" width="180" height="60" rx="11" stroke="#F2A25C" stroke-opacity=".6"/>
  <text x="520" y="314" class="lbl" font-size="13" font-weight="600" text-anchor="middle">LRU block cache</text>
  <text x="520" y="331" class="sub" font-size="10.5" text-anchor="middle">64 &#215; 4 KiB &#183; write-through</text>
  <text x="520" y="345" class="sub" font-size="10.5" text-anchor="middle">hash map + intrusive list</text>

  <rect class="node" x="656" y="252" width="196" height="52" rx="11"/>
  <text x="754" y="273" class="lbl" font-size="13" font-weight="600" text-anchor="middle">hit &#8212; served from heap</text>
  <text x="754" y="291" class="sub" font-size="10.5" text-anchor="middle">64 KiB read in <tspan fill="#7FD6A8">125 us</tspan></text>

  <rect class="node" x="656" y="336" width="196" height="52" rx="11"/>
  <text x="754" y="357" class="lbl" font-size="13" font-weight="600" text-anchor="middle">miss &#8212; 8 polled sectors</text>
  <text x="754" y="375" class="sub" font-size="10.5" text-anchor="middle">64 KiB read in <tspan fill="#F2A25C">305,428 us</tspan></text>

  <rect class="hw"   x="900" y="336" width="160" height="52" rx="11"/>
  <text x="980" y="357" class="lbl" font-size="13" font-weight="600" text-anchor="middle">ATA PIO &#8594; disk</text>
  <text x="980" y="375" class="sub" font-size="10.5" text-anchor="middle">primary slave, fs.img</text>

  <path class="edge" d="M190,322 L220,322"/>
  <path class="edge" d="M400,322 L430,322"/>
  <path class="edge" d="M610,312 L656,282"/>
  <path class="edgeA" d="M610,332 L656,360"/>
  <path class="edgeA" d="M852,362 L900,362"/>
  <!-- fill-on-miss, back into the cache: routed below the row so it does
       not cross the boxes or its own label -->
  <path class="win" d="M980,388 L980,410 L520,410 L520,354"/>
  <text x="750" y="404" class="sub" font-size="10.5" text-anchor="middle" fill="#F2A25C">fill on miss, evict least-recently-used</text>

  <!-- ============ measured band ============ -->
  <rect class="node" x="40" y="424" width="1020" height="140" rx="14" stroke-opacity=".55"/>
  <text x="62" y="452" class="h" font-size="15">What the cache actually bought</text>

  <text x="62"  y="474" class="sub" font-size="12">Same 64 KiB workload, one boot, toggled live with <tspan fill="#e9f0f5">fscache on|off</tspan>. Ratios this large do not fit on a linear bar, so here are the numbers.</text>

  <!-- column headers -->
  <text x="330" y="502" class="sub" font-size="11" text-anchor="end">cache off</text>
  <text x="470" y="502" class="sub" font-size="11" text-anchor="end">cache on</text>
  <text x="566" y="502" class="sub" font-size="11" text-anchor="end">change</text>
  <line x1="62" y1="510" x2="1038" y2="510" stroke="#2b3a47" stroke-width="1"/>

  <circle cx="70" cy="529" r="4" fill="#7FD6A8"/>
  <text x="84"  y="533" class="lbl" font-size="12.5">read 64 KiB</text>
  <text x="330" y="533" class="lbl" font-size="12.5" text-anchor="end" fill="#F2A25C">305,428 us</text>
  <text x="470" y="533" class="lbl" font-size="12.5" text-anchor="end" fill="#7FD6A8">125 us</text>
  <text x="566" y="533" class="lbl" font-size="12.5" text-anchor="end">~2,400&#215;</text>
  <text x="590" y="533" class="sub" font-size="11">blocks are resident, so the read never reaches the disk at all</text>

  <circle cx="70" cy="553" r="4" fill="#F2A25C"/>
  <text x="84"  y="557" class="lbl" font-size="12.5">write 64 KiB</text>
  <text x="330" y="557" class="lbl" font-size="12.5" text-anchor="end" fill="#F2A25C">37 KiB/s</text>
  <text x="470" y="557" class="lbl" font-size="12.5" text-anchor="end" fill="#7FD6A8">49 KiB/s</text>
  <text x="566" y="557" class="lbl" font-size="12.5" text-anchor="end">~1.3&#215;</text>
  <text x="590" y="557" class="sub" font-size="11">write-through by design: data hits the disk before the call returns</text>
</svg>
