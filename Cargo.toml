[workspace]
resolver = "2"
members = ["xtask", "libs/*"]
# `kernel` is deliberately NOT a workspace member: it targets x86_64-unknown-none
# via its own .cargo/config.toml, while xtask is a normal host binary. Keeping
# them out of one workspace avoids the two needing a single shared target.
#
# `libs/*` ARE members: they are the kernel's pure-logic crates, deliberately
# written `no_std` + host-buildable so `cargo test` covers them on the host
# without QEMU. The kernel depends on them by path across the exclude boundary.
exclude = ["kernel"]
